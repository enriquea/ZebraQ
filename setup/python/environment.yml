# ZebraQ - Python track (conda / mamba)
#
#   conda env create -f setup/python/environment.yml
#   conda activate zebraq-py
#   python -m ipykernel install --user --name zebraq-py --display-name "ZebraQ (Python)"
#
# If conda is slow, mamba is a drop-in replacement:
#   mamba env create -f setup/python/environment.yml
#
# Everything here comes from conda channels as a prebuilt package, including
# pydeseq2, so nothing has to be built from source. A pip package with no wheel
# for your platform gets compiled locally, which needs a toolchain and is the
# step most likely to fail on a student laptop.
#
# One exception, deliberately left out: the optional enrichment section at the
# end of S6 uses gseapy, which has no current Windows build on conda (bioconda
# stops at 0.9.x for win-64). That lesson installs it with pip at the point of
# use, and it needs internet access either way.

name: zebraq-py

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.11

  # core data handling
  - pandas=2.3.3
  - numpy=2.4.6

  # plotting
  - matplotlib=3.11.1
  - seaborn=0.13.2
  - adjusttext=1.4.0          # non-overlapping labels on the volcano plot (S5)

  # statistics
  - scipy=1.17.1
  - statsmodels=0.14.6        # Benjamini-Hochberg correction (S6)
  - scikit-learn=1.9.0

  # differential expression
  # bioconda ships this as a noarch package, so it installs identically on
  # macOS (Intel and Apple Silicon), Windows and Linux.
  - pydeseq2=0.5.4            # brings anndata in as a dependency

  # file formats
  - openpyxl=3.1.5
  - pyarrow=25.0.0

  # notebook environment
  - jupyterlab=4.6.2
  - notebook=7.6.1
  - ipykernel=7.3.0

  # reproducibility record (the equivalent of R's sessionInfo())
  # conda-forge carries 1.0.0; the pip package reaches 1.0.1, but the
  # difference does not matter for what the lessons use it for.
  - session-info=1.0.0
